spring.application.name=bookshop

# ── Our own settings (the "bookshop." prefix is ours) ──────────────
bookshop.shop-name=Bookshop
bookshop.currency=USD
bookshop.catalog.default-page-size=10
bookshop.catalog.max-page-size=100

# ── Security (tutorial 15) ─────────────────────────────────────────
# DEV-GRADE token-signing key. It is committed on purpose so the app
# runs out of the box - it is not a secret. The prod profile REPLACES
# it with the JWT_SECRET environment variable and refuses to start
# without one.
bookshop.security.jwt-secret=dev-only-signing-key-0123456789abcdef-not-a-secret
bookshop.security.token-ttl-minutes=60

# ── Database (tutorial 18) ─────────────────────────────────────────
# Flyway owns the schema (src/main/resources/db/migration). Hibernate
# only checks that entities and tables still agree - and refuses to
# start if they drifted apart.
spring.jpa.hibernate.ddl-auto=validate
