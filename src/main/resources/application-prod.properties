# Loaded when the "prod" profile is active.

# ── Logging (tutorial 14) ──────────────────────────────────────────
# One JSON object per line (ECS field names): machines parse these -
# log collectors (Elastic, Datadog, CloudWatch...) index every field.
# Humans read the dev format; production is written for machines.
logging.structured.format.console=ecs

# ── Security (tutorial 15) ─────────────────────────────────────────
# No defaults: prod does not start without these environment
# variables. ${VAR} with no ":fallback" = required.
bookshop.security.jwt-secret=${JWT_SECRET}
bookshop.admin.email=${ADMIN_EMAIL:}
bookshop.admin.password=${ADMIN_PASSWORD:}

# ── API docs (tutorial 17) ─────────────────────────────────────────
# The spec and UI are development tools. Public API? Expose them on
# purpose. Internal API? Keep them off in prod, like this:
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Database (tutorial 18) ─────────────────────────────────────────
# Prod talks to PostgreSQL, configured entirely from the environment.
# No fallbacks: missing DB config = the app refuses to start.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ── Production behavior (tutorial 19) ──────────────────────────────
# Finish in-flight requests before stopping (up to the timeout)
# instead of cutting connections when the platform sends SIGTERM.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
